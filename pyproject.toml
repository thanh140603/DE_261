[project]
name = "edu-platform"
version = "0.1.0"
description = "Data engineering platform for a large-scale online education system (DE_261)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "DE_261 Team" }]

# Core runtime dependencies shared by every deployable.
# Heavy engines (Spark, Flink) live in optional groups so a service image
# does not pull a JVM stack it never uses.
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "structlog>=24.1",
  "typer>=0.12",
  "confluent-kafka>=2.4",
  "redis>=5.0",
  "orjson>=3.10",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.1,<4",
]

[project.optional-dependencies]
spark = [
  "pyspark>=3.5",
  "delta-spark>=3.2",
]
flink = [
  "apache-flink>=1.19",
]
content = [
  "boto3>=1.34",
  "pypdf>=4.2",
  "opensearch-py>=2.6",
]
service = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
]
demo = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
]
orchestration = [
  "apache-airflow>=2.9",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "testcontainers[kafka,redis,postgres]>=4.5",
  "httpx>=0.27",
]

[project.scripts]
edu = "edu_platform.entrypoints.cli:app"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edu_platform"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF012", "N818"]  # N818: domain exceptions are named as concepts

[tool.ruff.lint.per-file-ignores]
"src/edu_platform/entrypoints/api/routers/*" = ["B008"]  # FastAPI Depends() idiom
"src/edu_platform/demo/*" = ["E501"]  # seed data and scenario copy are long strings

[tool.ruff.lint.isort]
known-first-party = ["edu_platform"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["edu_platform"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
  "unit: fast, isolated, no I/O",
  "integration: requires docker services (kafka, redis, postgres, minio)",
  "e2e: full pipeline run against local stack",
]

[tool.coverage.run]
source = ["edu_platform"]
branch = true
