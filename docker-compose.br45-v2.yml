# Optional persistent MinIO lakehouse. The base profile stores Delta in its checkpoint volume.
services:
  br45-stream:
    depends_on:
      minio:
        condition: service_healthy
      hive-metastore:
        condition: service_healthy
    environment:
      EDU_BR45_LAKEHOUSE_ROOT: ${EDU_BR45_LAKEHOUSE_ROOT:-s3a://lakehouse/br45-v2}
      EDU_HIVE_METASTORE_URI: thrift://hive-metastore:9083
      EDU_LAKEHOUSE_ROOT: s3a://lakehouse
      EDU_S3_ENDPOINT: http://minio:9000
      EDU_S3_ACCESS_KEY: minioadmin
      EDU_S3_SECRET_KEY: minioadmin
