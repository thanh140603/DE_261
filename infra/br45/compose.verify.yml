# Run with -p de261-br45-verify and pass this file last.
# Published ports and image tags keep a running LMS deployment separate.
x-api-image: &api-image de261/verify-demo:local
x-spark-image: &spark-image de261/verify-spark:local

services:
  demo:
    container_name: !reset null
    image: *api-image
    ports: !override ["127.0.0.1:18080:8000"]
  kafka:
    container_name: !reset null
    ports: !override ["127.0.0.1:19092:9092"]
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:19092
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    mem_limit: 640m
  connect:
    container_name: !reset null
    ports: !override ["127.0.0.1:18083:8083"]
    environment:
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    mem_limit: 640m
  postgres:
    container_name: !reset null
    ports: !override ["127.0.0.1:15433:5432"]
    mem_limit: 384m
  redis:
    container_name: !reset null
    ports: !reset []
  minio:
    container_name: !reset null
    image: de261/verify-minio:local
    ports: !override ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
  minio-init:
    container_name: !reset null
    image: de261/verify-minio:local
  metastore-db:
    container_name: !reset null
  hive-metastore:
    container_name: !reset null
    image: de261/verify-metastore:local
    ports: !reset []
  br45-init:
    image: *api-image
  br45-cdc:
    image: *api-image
  br45-stream:
    image: *spark-image
    environment:
      EDU_BR45_LAKEHOUSE_ROOT: ${BR45_VERIFY_LAKEHOUSE_ROOT:-s3a://lakehouse/br45-v2}
      EDU_S3_ENDPOINT: http://minio:9000
      EDU_S3_ACCESS_KEY: minioadmin
      EDU_S3_SECRET_KEY: minioadmin
      PYSPARK_SUBMIT_ARGS: --driver-memory 768m pyspark-shell
    depends_on:
      minio-init:
        condition: service_completed_successfully
