# Delta Lake tables registered in the Hive Metastore by Spark. Spark is the only writer
# (ADR 0011); Trino serves them read-only - enforced for every user by the catalog rule in
# rules.json (connector-level read_only security would also block table_changes / CDF).
connector.name=delta_lake
hive.metastore.uri=thrift://hive-metastore:9083

fs.native-s3.enabled=true
s3.endpoint=${ENV:EDU_S3_ENDPOINT}
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:EDU_S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:EDU_S3_SECRET_KEY}
