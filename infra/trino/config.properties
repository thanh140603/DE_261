# Single node (coordinator also schedules work). Memory sized for mem_limit 2g with a fixed
# 1.2 GB heap (jvm.config): the image default (80 % of RAM as heap) plus code cache,
# metaspace and direct buffers exceeded the container limit and got the JVM OOM-killed.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
catalog.management=${ENV:CATALOG_MANAGEMENT}
query.max-memory=600MB
query.max-memory-per-node=600MB
