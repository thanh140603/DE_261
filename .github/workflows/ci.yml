name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.11
      - run: uv sync --all-extras
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pytest -m "not integration and not e2e" tests/unit --cov --cov-report=xml

  # TODO: integration job that boots docker-compose.yml
  # (kafka, redis, postgres, minio) and runs tests/integration.
