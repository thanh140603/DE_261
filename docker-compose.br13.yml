# BR1/BR3 services overlay. Merge on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.br13.yml up -d --build
# Each service reuses the demo image (Python package already installed) with a
# different command; the web client build is shared by the `demo` service.

x-br13-environment: &br13-environment
  EDU_ENV: docker
  EDU_PII_HMAC_SECRET: ${EDU_PII_HMAC_SECRET:-demo-secret}
  EDU_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  EDU_REDIS_URL: redis://redis:6379/0
  EDU_POSTGRES_DSN: postgresql://lms:lms@postgres:5432/lms
  EDU_EMAIL_SMTP_URL: ${EDU_EMAIL_SMTP_URL:-}
  EDU_EMAIL_FROM: ${EDU_EMAIL_FROM:-no-reply@edu.local}
  EDU_PUSH_WEBHOOK_URL: ${EDU_PUSH_WEBHOOK_URL:-}

services:
  # The UI API becomes a BFF in this overlay: notifications are read from Redis
  # and submissions are proxied to grading-ingest.
  demo:
    environment:
      EDU_BR13_MODE: service
      EDU_GRADING_SERVICE_URL: http://grading-ingest:8001
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      grading-ingest: { condition: service_healthy }

  # One-shot catalogue apply. Consumers cannot auto-create topics on subscribe,
  # so this must run before the four long-running services start.
  kafka-init:
    build: { context: ., dockerfile: Dockerfile }
    image: de261/demo:local
    container_name: de261-kafka-init
    environment: *br13-environment
    command:
      ["python", "-m", "edu_platform.entrypoints.cli", "infra", "create-topics", "/app/infra/kafka/topics.yaml"]
    depends_on:
      kafka: { condition: service_healthy }
    restart: "no"

  grading-ingest:
    build: { context: ., dockerfile: Dockerfile }
    image: de261/demo:local
    container_name: de261-grading-ingest
    ports: ["${GRADING_PORT:-8001}:8001"]
    environment:
      <<: *br13-environment
      EDU_GRADING_PORT: "8001"
    command: ["python", "-m", "edu_platform.entrypoints.services.grading_ingestion.main"]
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    depends_on:
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      redis: { condition: service_started }
    restart: unless-stopped

  grading-worker:
    build: { context: ., dockerfile: Dockerfile }
    image: de261/demo:local
    container_name: de261-grading-worker
    environment: *br13-environment
    command: ["python", "-m", "edu_platform.entrypoints.services.grading_worker.main"]
    healthcheck: { disable: true }  # long-running consumer; the image healthcheck targets the demo HTTP port
    depends_on:
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      redis: { condition: service_started }
    restart: unless-stopped

  grading-normalizer:
    build: { context: ., dockerfile: Dockerfile }
    image: de261/demo:local
    container_name: de261-grading-normalizer
    environment: *br13-environment
    command: ["python", "-m", "edu_platform.entrypoints.services.grading_normalizer.main"]
    healthcheck: { disable: true }  # long-running consumer; the image healthcheck targets the demo HTTP port
    depends_on:
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      redis: { condition: service_started }
    restart: unless-stopped

  notification:
    build: { context: ., dockerfile: Dockerfile }
    image: de261/demo:local
    container_name: de261-notification
    environment: *br13-environment
    command: ["python", "-m", "edu_platform.entrypoints.services.notification_service.main"]
    healthcheck: { disable: true }  # long-running consumer; the image healthcheck targets the demo HTTP port
    depends_on:
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      redis: { condition: service_started }
      postgres: { condition: service_healthy }
    restart: unless-stopped
