# DE_261 - the whole stack in one file.
#
#   docker compose up -d --build     # everything; open http://localhost:8000
#   docker compose down -v           # stop and drop volumes
#
# Services
#   demo            web client + API + in-process pipelines (the thing you demo)
#   kafka           event bus (KRaft, no ZooKeeper)          localhost:9092
#   kafka-ui        browse topics / messages                 http://localhost:8090
#   schema-registry Avro/JSON contracts                      http://localhost:8081
#   connect         Debezium CDC (register: see README 'Developer commands')  :8083
#   postgres        LMS OLTP source, wal_level=logical        localhost:5433 (POSTGRES_PORT)
#   redis           online features / risk scores / notif state    localhost:6379
#   minio           object storage: lakehouse + corpus       http://localhost:9001
#   metastore-db    Postgres backing the Hive Metastore      (internal)
#   hive-metastore  lakehouse catalog shared by Spark/Trino  thrift://localhost:9083
#   trino           SQL warehouse over Delta (read-only)     http://localhost:8091
#   flink-*         streaming engine                         http://localhost:8082
#   spark, spark-worker  batch engine (Spark 3.5 + Delta)    http://localhost:8080
#
# Lakehouse warehouse (ADR 0010-0012, docs/architecture/pipelines.md):
#   docker compose run --rm spark-jobs edu warehouse bootstrap
#   docker compose run --rm spark-jobs edu warehouse run --run-date 2026-10-18
#   docker compose --profile pipelines up -d      # Kafka -> bronze -> silver streaming landing
#
# Other BRs retain the in-process demo (ADR 0008). The opt-in br45 profile runs
# real CDC, persistent marts and Spark windows (ADR 0009). Set DEMO_PORT for :8000.
name: de261

x-br45-environment: &br45-environment
  EDU_BR45_DSN: postgresql://lms:lms@postgres:5432/lms
  EDU_BR45_KAFKA: kafka:29092
  EDU_BR45_CLOCK_MODE: ${EDU_BR45_CLOCK_MODE:-wall}
  EDU_BR45_SLIDE_SECONDS: ${EDU_BR45_SLIDE_SECONDS:-3600}
  EDU_BR45_LATENESS_DAYS: ${EDU_BR45_LATENESS_DAYS:-21}
  EDU_BR45_MIN_STUDENTS: ${EDU_BR45_MIN_STUDENTS:-20}
  EDU_BR45_QUESTION_THRESHOLD: ${EDU_BR45_QUESTION_THRESHOLD:-0.30}
  EDU_BR45_CASE_THRESHOLD: ${EDU_BR45_CASE_THRESHOLD:-0.20}
  EDU_BR45_PEER_GAP: ${EDU_BR45_PEER_GAP:-0.50}
  EDU_BR45_DROP_THRESHOLD: ${EDU_BR45_DROP_THRESHOLD:-0.30}
  EDU_BR45_INACTIVITY_POINTS: ${EDU_BR45_INACTIVITY_POINTS:-35}
  EDU_BR45_MISSED_POINTS: ${EDU_BR45_MISSED_POINTS:-30}
  EDU_BR45_COMPLETION_POINTS: ${EDU_BR45_COMPLETION_POINTS:-20}
  EDU_BR45_DECLINE_POINTS: ${EDU_BR45_DECLINE_POINTS:-15}
  EDU_BR45_MEDIUM_THRESHOLD: ${EDU_BR45_MEDIUM_THRESHOLD:-30}
  EDU_BR45_HIGH_THRESHOLD: ${EDU_BR45_HIGH_THRESHOLD:-60}
  EDU_BR45_CRITICAL_THRESHOLD: ${EDU_BR45_CRITICAL_THRESHOLD:-80}
  EDU_BR45_ALERT_THRESHOLD: ${EDU_BR45_ALERT_THRESHOLD:-60}
  EDU_BR45_COOLDOWN_HOURS: ${EDU_BR45_COOLDOWN_HOURS:-72}

services:
  # --- demo (web + server) ---------------------------------------------------------
  demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: de261/demo:local
    container_name: de261-demo
    ports:
      - "${DEMO_PORT:-8000}:8000"
    environment:
      <<: *br45-environment
      EDU_ENV: docker
      EDU_PII_HMAC_SECRET: ${EDU_PII_HMAC_SECRET:-demo-secret}
      EDU_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EDU_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      EDU_REDIS_URL: redis://redis:6379/0
      EDU_POSTGRES_DSN: postgresql://lms:lms@postgres:5432/lms
      EDU_BR45_DSN: postgresql://lms:lms@postgres:5432/lms
      # Public local demonstration tokens only. Set EDU_BR45_AUTH for any shared deployment.
      EDU_BR45_AUTH: '${EDU_BR45_AUTH:-{"instructor-demo":{"id":"instructor-local","role":"instructor","courses":["c-py-201","c-sql-101","c-de-301"]},"advisor-demo":{"id":"advisor-local","role":"advisor","courses":["c-py-201"]},"learner-demo":{"id":"br45-demo-at-risk","role":"learner","courses":["c-py-201"]}}}'
      EDU_S3_ENDPOINT: http://minio:9000
      EDU_S3_ACCESS_KEY: minioadmin
      EDU_S3_SECRET_KEY: minioadmin
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5

  # --- ingestion / event bus ---------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: de261-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: de261-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: de261
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
      DYNAMIC_CONFIG_ENABLED: "true"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: de261-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports: ["8081:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092

  connect:
    # Debezium CDC (BR5 source). Register the connector with the curl command in the README.
    image: debezium/connect:2.6
    container_name: de261-connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: edu-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  # --- OLTP source ---------------------------------------------------------------------
  postgres:
    # LMS source of truth. wal_level=logical lets Debezium read the WAL without query load.
    image: postgres:16
    container_name: de261-postgres
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- serving layer ----------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: de261-redis
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  # --- object storage (lakehouse + corpus) ---------------------------------------------------
  minio:
    build: &minio-build
      context: ./infra/minio
    image: de261/minio:local
    pull_policy: build
    container_name: de261-minio
    ports: ["9000:9000", "9001:9001"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    build: *minio-build
    image: de261/minio:local
    pull_policy: build
    container_name: de261-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/lakehouse local/corpus local/checkpoints &&
      mc version enable local/corpus &&
      exit 0"

  # --- lakehouse catalog + SQL warehouse (ADR 0010) ---------------------------------------------
  metastore-db:
    image: postgres:16-alpine
    container_name: de261-metastore-db
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: metastore
    volumes:
      - metastore-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 3s
      retries: 10

  hive-metastore:
    build: ./infra/hive-metastore
    image: de261/hive-metastore:3.1.3
    platform: linux/amd64          # upstream image is amd64-only; runs emulated on Apple silicon
    container_name: de261-hive-metastore
    ports: ["9083:9083"]
    environment:
      HIVE_CUSTOM_CONF_DIR: /hive-conf
      METASTORE_HEAP: 512m
    volumes:
      - ./infra/hive-metastore/conf:/hive-conf:ro
    depends_on:
      metastore-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9083'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  trino:
    image: trinodb/trino:478
    container_name: de261-trino
    ports: ["8091:8080"]
    mem_limit: 2g
    environment:
      EDU_S3_ENDPOINT: http://minio:9000
      EDU_S3_ACCESS_KEY: minioadmin
      EDU_S3_SECRET_KEY: minioadmin
    volumes:
      - ./infra/trino/catalog/lakehouse.properties:/etc/trino/catalog/lakehouse.properties:ro
      - ./infra/trino/access-control.properties:/etc/trino/access-control.properties:ro
      - ./infra/trino/rules.json:/etc/trino/rules.json:ro
    depends_on:
      hive-metastore:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "trino --execute 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # --- processing engines ---------------------------------------------------------------------
  flink-jobmanager:
    image: flink:1.19-scala_2.12-java11
    container_name: de261-flink-jobmanager
    ports: ["8082:8081"]
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        state.backend: rocksdb
        state.checkpoints.dir: s3://checkpoints/flink
        s3.endpoint: http://minio:9000
        s3.access-key: minioadmin
        s3.secret-key: minioadmin
        s3.path.style.access: true

  flink-taskmanager:
    image: flink:1.19-scala_2.12-java11
    container_name: de261-flink-taskmanager
    depends_on: [flink-jobmanager]
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4

  spark:
    # Spark 3.5 + Delta 3.3 + S3A + Python 3.11 (infra/spark/Dockerfile); one image for every
    # Spark process so driver and executor Python always match.
    build:
      context: .
      dockerfile: infra/spark/Dockerfile
    image: de261/spark:local
    container_name: de261-spark
    ports: ["8080:8080", "7077:7077"]
    command: ["spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark"]
    environment:
      SPARK_NO_DAEMONIZE: "true"

  spark-worker:
    image: de261/spark:local
    container_name: de261-spark-worker
    depends_on: [spark]
    command: ["spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark:7077", "--memory", "2G"]
    environment:
      SPARK_NO_DAEMONIZE: "true"

  # --- lakehouse data pipelines (opt-in, ADR 0011) -------------------------------------------
  spark-jobs:
    # One-off batch jobs: docker compose run --rm spark-jobs edu warehouse run --run-date YYYY-MM-DD
    image: de261/spark:local
    profiles: ["jobs", "pipelines"]
    environment: &lakehouse-env
      EDU_ENV: docker
      EDU_SPARK_MASTER: ${EDU_SPARK_MASTER:-local[*]}
      EDU_HIVE_METASTORE_URI: thrift://hive-metastore:9083
      EDU_LAKEHOUSE_ROOT: s3a://lakehouse
      EDU_S3_ENDPOINT: http://minio:9000
      EDU_S3_ACCESS_KEY: minioadmin
      EDU_S3_SECRET_KEY: minioadmin
      EDU_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EDU_PII_HMAC_SECRET: ${EDU_PII_HMAC_SECRET:-demo-secret}
    volumes:
      - ./warehouse:/app/warehouse:ro
      - ./infra/kafka:/app/infra/kafka:ro
    depends_on:
      hive-metastore:
        condition: service_healthy
    command: ["edu", "warehouse", "--help"]

  lakehouse-streaming:
    # Always-on Structured Streaming: Kafka -> bronze (append) -> silver (MERGE). ADR 0011.
    image: de261/spark:local
    container_name: de261-lakehouse-streaming
    profiles: ["pipelines"]
    environment:
      <<: *lakehouse-env
      EDU_SPARK_MASTER: local[2]
    volumes:
      - ./warehouse:/app/warehouse:ro
    depends_on:
      kafka:
        condition: service_healthy
      hive-metastore:
        condition: service_healthy
    command: ["edu", "stream", "lakehouse-landing"]
    restart: unless-stopped

  # BR4/BR5 production data path; opt in with --profile br45.
  br45-init:
    profiles: ["br45"]
    image: de261/demo:local
    build:
      context: .
      dockerfile: Dockerfile
    environment: *br45-environment
    depends_on:
      connect:
        condition: service_healthy
    command: ["sh", "-c", "python -m edu_platform.br45.cli migrate && python -m edu_platform.br45.cli register --connect-url http://connect:8083"]
    healthcheck:
      disable: true

  br45-cdc:
    profiles: ["br45"]
    image: de261/demo:local
    environment: *br45-environment
    depends_on:
      br45-init:
        condition: service_completed_successfully
    command: ["python", "-m", "edu_platform.br45.cli", "cdc"]
    healthcheck:
      test: ["CMD", "python", "-c", "from edu_platform.br45.db import connect\nwith connect() as c:\n c.execute('SELECT 1')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: on-failure:5

  br45-stream:
    profiles: ["br45"]
    build:
      context: .
      dockerfile: infra/br45/Dockerfile
    image: de261/br45-spark:local
    environment:
      <<: *br45-environment
      EDU_BR45_CHECKPOINT: /checkpoints/br45-v1
    volumes:
      - br45-checkpoints:/checkpoints
    depends_on:
      br45-init:
        condition: service_completed_successfully
    restart: on-failure:5

  # TODO: opensearch (content search/vector index), airflow (webserver + scheduler running
  #       orchestration/airflow/dags), prometheus/grafana for consumer-lag and checkpoint metrics.

volumes:
  postgres-data:
  redis-data:
  minio-data:
  metastore-db-data:
  br45-checkpoints:
