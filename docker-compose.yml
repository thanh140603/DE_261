# DE_261 - the whole stack in one file.
#
#   docker compose up -d --build     # everything; open http://localhost:8000
#   docker compose down -v           # stop and drop volumes
#
# Services
#   demo            web client + API + in-process pipelines (the thing you demo)
#   kafka           event bus (KRaft, no ZooKeeper)          localhost:9092
#   kafka-ui        browse topics / messages                 http://localhost:8090
#   schema-registry Avro/JSON contracts                      http://localhost:8081
#   connect         Debezium CDC (register: see README 'Developer commands')  :8083
#   postgres        LMS OLTP source, wal_level=logical        localhost:5432
#   redis           online features / risk scores / notif state    localhost:6379
#   seaweedfs       S3 object storage: lakehouse + corpus    S3 localhost:9000, UI http://localhost:8888
#   metastore-db    Postgres backing the Hive Metastore      (internal)
#   hive-metastore  lakehouse catalog shared by Spark/Trino  thrift://localhost:9083
#   trino           SQL warehouse over Delta (read-only)     http://localhost:8091
#   flink-*         streaming engine                         http://localhost:8082
#   spark, spark-worker  batch engine (Spark 3.5 + Delta)    http://localhost:8080
#
# Opt-in profiles (data pipelines, see docs/architecture/pipelines.md):
#   docker compose --profile pipelines up -d      # Kafka -> bronze -> silver streaming landing
#   docker compose run --rm spark-jobs edu warehouse bootstrap
#   docker compose run --rm spark-jobs edu warehouse run --run-date 2026-10-18
#
# The demo container runs the pipelines in-process (ADR 0008); the warehouse services are
# the production path (ADR 0009/0010). Set DEMO_PORT to change :8000.
name: de261

services:
  # --- demo (web + server) ---------------------------------------------------------
  demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: de261/demo:local
    container_name: de261-demo
    ports:
      - "${DEMO_PORT:-8000}:8000"
    environment:
      EDU_ENV: docker
      EDU_PII_HMAC_SECRET: ${EDU_PII_HMAC_SECRET:-demo-secret}
      EDU_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EDU_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      EDU_REDIS_URL: redis://redis:6379/0
      EDU_POSTGRES_DSN: postgresql://lms:lms@postgres:5432/lms
      EDU_S3_ENDPOINT: http://seaweedfs:8333
      EDU_S3_ACCESS_KEY: ${EDU_S3_ACCESS_KEY:-lakehouse}
      EDU_S3_SECRET_KEY: ${EDU_S3_SECRET_KEY:-lakehouse-secret-key}
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5

  # --- ingestion / event bus ---------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: de261-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: de261-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: de261
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
      DYNAMIC_CONFIG_ENABLED: "true"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: de261-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports: ["8081:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092

  connect:
    # Debezium CDC (BR5 source). Register the connector with the curl command in the README.
    image: debezium/connect:2.6
    container_name: de261-connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: edu-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

  # --- OLTP source ---------------------------------------------------------------------
  postgres:
    # LMS source of truth. wal_level=logical lets Debezium read the WAL without query load.
    image: postgres:16
    container_name: de261-postgres
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- serving layer ----------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: de261-redis
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  # --- object storage (lakehouse + corpus) ---------------------------------------------------
  seaweedfs:
    # S3-compatible object storage (replaces MinIO, whose images left Docker Hub on 2026-09-11).
    # Same role: s3a:// lakehouse, versioned corpus bucket, Flink checkpoints.
    image: chrislusf/seaweedfs:4.48
    container_name: de261-seaweedfs
    ports: ["9000:8333", "8888:8888"]
    command: >
      server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=256 -master.defaultReplication=000 -volume.max=0
      -filer -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -O /dev/null http://127.0.0.1:8888/"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3-init:
    image: curlimages/curl:8.23.0
    container_name: de261-s3-init
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${EDU_S3_ACCESS_KEY:-lakehouse}
      S3_SECRET_KEY: ${EDU_S3_SECRET_KEY:-lakehouse-secret-key}
    volumes:
      - ./infra/seaweedfs/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    restart: on-failure

  # --- lakehouse catalog + SQL warehouse (ADR 0009) ---------------------------------------------
  metastore-db:
    image: postgres:16-alpine
    container_name: de261-metastore-db
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: metastore
    volumes:
      - metastore-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 3s
      retries: 10

  hive-metastore:
    build: ./infra/hive-metastore
    image: de261/hive-metastore:3.1.3
    platform: linux/amd64          # upstream image is amd64-only; runs emulated on Apple silicon
    container_name: de261-hive-metastore
    ports: ["9083:9083"]
    environment:
      HIVE_CUSTOM_CONF_DIR: /hive-conf
      METASTORE_HEAP: 512m
    volumes:
      - ./infra/hive-metastore/conf:/hive-conf:ro
    depends_on:
      metastore-db:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9083'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  trino:
    image: trinodb/trino:478
    container_name: de261-trino
    ports: ["8091:8080"]
    mem_limit: 2g
    environment:
      EDU_S3_ENDPOINT: http://seaweedfs:8333
      EDU_S3_ACCESS_KEY: ${EDU_S3_ACCESS_KEY:-lakehouse}
      EDU_S3_SECRET_KEY: ${EDU_S3_SECRET_KEY:-lakehouse-secret-key}
    volumes:
      - ./infra/trino/catalog/lakehouse.properties:/etc/trino/catalog/lakehouse.properties:ro
      - ./infra/trino/access-control.properties:/etc/trino/access-control.properties:ro
      - ./infra/trino/rules.json:/etc/trino/rules.json:ro
    depends_on:
      hive-metastore:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "trino --execute 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # --- processing engines ---------------------------------------------------------------------
  flink-jobmanager:
    image: flink:1.19-scala_2.12-java11
    container_name: de261-flink-jobmanager
    ports: ["8082:8081"]
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        state.backend: rocksdb
        state.checkpoints.dir: s3://checkpoints/flink
        s3.endpoint: http://seaweedfs:8333
        s3.access-key: lakehouse
        s3.secret-key: lakehouse-secret-key
        s3.path.style.access: true

  flink-taskmanager:
    image: flink:1.19-scala_2.12-java11
    container_name: de261-flink-taskmanager
    depends_on: [flink-jobmanager]
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4

  spark:
    # Spark 3.5 + Delta 3.3 + S3A + Python 3.11 (infra/spark/Dockerfile); one image for every
    # Spark process so driver and executor Python always match.
    build:
      context: .
      dockerfile: infra/spark/Dockerfile
    image: de261/spark:local
    container_name: de261-spark
    ports: ["8080:8080", "7077:7077"]
    command: ["spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark"]
    environment:
      SPARK_NO_DAEMONIZE: "true"

  spark-worker:
    image: de261/spark:local
    container_name: de261-spark-worker
    depends_on: [spark]
    command: ["spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark:7077", "--memory", "2G"]
    environment:
      SPARK_NO_DAEMONIZE: "true"

  # --- data pipelines (opt-in) --------------------------------------------------------------
  spark-jobs:
    # One-off batch jobs: docker compose run --rm spark-jobs edu warehouse run --run-date YYYY-MM-DD
    image: de261/spark:local
    profiles: ["jobs", "pipelines"]
    environment: &lakehouse-env
      EDU_ENV: docker
      EDU_SPARK_MASTER: ${EDU_SPARK_MASTER:-local[*]}
      EDU_HIVE_METASTORE_URI: thrift://hive-metastore:9083
      EDU_LAKEHOUSE_ROOT: s3a://lakehouse
      EDU_S3_ENDPOINT: http://seaweedfs:8333
      EDU_S3_ACCESS_KEY: ${EDU_S3_ACCESS_KEY:-lakehouse}
      EDU_S3_SECRET_KEY: ${EDU_S3_SECRET_KEY:-lakehouse-secret-key}
      EDU_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EDU_PII_HMAC_SECRET: ${EDU_PII_HMAC_SECRET:-demo-secret}
    volumes:
      - ./warehouse:/app/warehouse:ro
      - ./infra/kafka:/app/infra/kafka:ro
    depends_on:
      hive-metastore:
        condition: service_healthy
    command: ["edu", "warehouse", "--help"]

  lakehouse-streaming:
    # Always-on Structured Streaming: Kafka -> bronze (append) -> silver (MERGE). ADR 0010.
    image: de261/spark:local
    container_name: de261-lakehouse-streaming
    profiles: ["pipelines"]
    environment:
      <<: *lakehouse-env
      EDU_SPARK_MASTER: local[2]
    volumes:
      - ./warehouse:/app/warehouse:ro
    depends_on:
      kafka:
        condition: service_healthy
      hive-metastore:
        condition: service_healthy
    command: ["edu", "stream", "lakehouse-landing"]
    restart: unless-stopped

  # TODO: opensearch (content search/vector index), airflow (webserver + scheduler running
  #       orchestration/airflow/dags), prometheus/grafana for consumer-lag and checkpoint metrics.

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
  metastore-db-data:
