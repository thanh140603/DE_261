# DE_261 - the whole stack in one file.
#
#   docker compose up -d --build     # everything; open http://localhost:8000
#   docker compose down -v           # stop and drop volumes
#
# Services
#   demo            web client + API + in-process pipelines (the thing you demo)
#   kafka           event bus (KRaft, no ZooKeeper)          localhost:9092
#   kafka-ui        browse topics / messages                 http://localhost:8090
#   schema-registry Avro/JSON contracts                      http://localhost:8081
#   connect         Debezium CDC (register: see README 'Developer commands')  :8083
#   postgres        LMS OLTP source, wal_level=logical        localhost:5432
#   redis           online features / risk scores / notif state    localhost:6379
#   minio           object storage: lakehouse + corpus       http://localhost:9001
#   flink-*         streaming engine                         http://localhost:8082
#   spark, spark-worker  batch engine                        http://localhost:8080
#
# The demo container runs the pipelines in-process (ADR 0008) and does not yet
# consume the Kafka/Redis/Postgres services; they are the production path whose
# adapters are TODO stubs under src/edu_platform. Set DEMO_PORT to change :8000.
name: de261

services:
  # --- demo (web + server) ---------------------------------------------------------
  demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: de261/demo:local
    container_name: de261-demo
    ports:
      - "${DEMO_PORT:-8000}:8000"
    environment:
      EDU_ENV: docker
      EDU_PII_HMAC_SECRET: ${EDU_PII_HMAC_SECRET:-demo-secret}
      EDU_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EDU_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      EDU_REDIS_URL: redis://redis:6379/0
      EDU_POSTGRES_DSN: postgresql://lms:lms@postgres:5432/lms
      EDU_S3_ENDPOINT: http://minio:9000
      EDU_S3_ACCESS_KEY: minioadmin
      EDU_S3_SECRET_KEY: minioadmin
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5

  # --- ingestion / event bus ---------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: de261-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: de261-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: de261
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
      DYNAMIC_CONFIG_ENABLED: "true"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: de261-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports: ["8081:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092

  connect:
    # Debezium CDC (BR5 source). Register the connector with the curl command in the README.
    image: debezium/connect:2.6
    container_name: de261-connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: edu-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

  # --- OLTP source ---------------------------------------------------------------------
  postgres:
    # LMS source of truth. wal_level=logical lets Debezium read the WAL without query load.
    image: postgres:16
    container_name: de261-postgres
    ports: ["5432:5432"]
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- serving layer ----------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: de261-redis
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  # --- object storage (lakehouse + corpus) ---------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: de261-minio
    ports: ["9000:9000", "9001:9001"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: de261-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/lakehouse local/corpus local/checkpoints &&
      mc version enable local/corpus &&
      exit 0"

  # --- processing engines ---------------------------------------------------------------------
  flink-jobmanager:
    image: flink:1.19-scala_2.12-java11
    container_name: de261-flink-jobmanager
    ports: ["8082:8081"]
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        state.backend: rocksdb
        state.checkpoints.dir: s3://checkpoints/flink
        s3.endpoint: http://minio:9000
        s3.access-key: minioadmin
        s3.secret-key: minioadmin
        s3.path.style.access: true

  flink-taskmanager:
    image: flink:1.19-scala_2.12-java11
    container_name: de261-flink-taskmanager
    depends_on: [flink-jobmanager]
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4

  spark:
    image: apache/spark:3.5.1
    container_name: de261-spark
    ports: ["8080:8080", "7077:7077"]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark"]
    environment:
      SPARK_NO_DAEMONIZE: "true"

  spark-worker:
    image: apache/spark:3.5.1
    container_name: de261-spark-worker
    depends_on: [spark]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark:7077", "--memory", "2G"]
    environment:
      SPARK_NO_DAEMONIZE: "true"

  # TODO: opensearch (content search/vector index), airflow (webserver + scheduler),
  #       prometheus/grafana for consumer-lag and checkpoint metrics.

volumes:
  postgres-data:
  redis-data:
  minio-data:
